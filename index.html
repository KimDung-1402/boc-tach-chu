<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cáo OCR Pro Max - Dạy AI</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 900px; margin: 20px auto; padding: 20px; background: #f3f4f6; color: #1f2937; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { text-align: center; margin-top: 0; color: #e85d04; }
        #drop-zone { border: 2px dashed #9ca3af; border-radius: 8px; padding: 30px; text-align: center; background: #f9fafb; transition: all 0.2s; cursor: pointer; outline: none; }
        #drop-zone:hover, #drop-zone.dragover { border-color: #e85d04; background: #fff7ed; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; border-bottom: 2px solid #f3f4f6; padding-bottom: 10px; }
        .gallery { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; min-height: 80px; }
        .thumb-wrapper { position: relative; width: 80px; height: 80px; border: 3px solid transparent; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .thumb-wrapper.active { border-color: #e85d04; transform: scale(1.05); box-shadow: 0 4px 6px rgba(232, 93, 4, 0.3); }
        .thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; border-radius: 5px; }
        .delete-btn { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }
        .delete-btn:hover { background: #dc2626; transform: scale(1.1); }
        #crop-area { max-width: 100%; max-height: 450px; margin-top: 20px; display: none; }
        
        .action-panel { margin-top: 20px; padding: 15px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; display: none; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn { padding: 12px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: bold; transition: background 0.2s; color: white; text-align: center; }
        .btn-sync { background: #0ea5e9; width: 100%; }
        .btn-sync:hover { background: #0284c7; }
        .btn-single { background: #10b981; flex: 1; }
        .btn-single:hover { background: #059669; }
        .btn-batch { background: #8b5cf6; flex: 1.5; }
        .btn-batch:hover { background: #6d28d9; }
        .btn-danger { background: #ef4444; padding: 8px 12px; }
        .btn-primary { background: #e85d04; width: 100%; margin-top: 15px; }
        .btn-primary:hover { background: #dc2626; }
        .btn:disabled { background: #9ca3af !important; cursor: not-allowed; }
        
        .status { margin: 15px 0; font-weight: bold; color: #d97706; text-align: center; min-height: 24px; }
        #result { width: 100%; height: 250px; padding: 15px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; resize: vertical; box-sizing: border-box; }
        
        /* Khu vực Blacklist - Dạy AI */
        .filter-panel { margin-top: 10px; padding: 15px; background: #fff5f5; border: 1px solid #fed7d7; border-radius: 8px; }
        .btn-filter { background: #475569; padding: 8px 15px; border-radius: 6px; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-filter:hover { background: #334155; }
        .blacklist-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .bad-word-tag { background: #fee2e2; color: #b91c1c; border: 1px solid #f87171; padding: 5px 10px; border-radius: 4px; font-size: 13px; display: flex; align-items: center; gap: 5px; }
        .remove-word { cursor: pointer; font-weight: bold; color: #991b1b; }
        .remove-word:hover { color: red; }
        
        canvas { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cáo OCR Pro Max 🦊</h1>
        <p style="text-align: center;">Tự động hóa & Tự học từ khóa rác</p>
        
        <input type="file" id="file-input" multiple accept="image/*" style="display: none;">
        <div id="drop-zone" tabindex="0">
            Kéo thả nhiều ảnh vào đây<br>hoặc <b>Click</b> / <b>Ctrl + V</b>
        </div>

        <div class="toolbar">
            <h3 style="margin: 0; color: #374151;">Khay ảnh (<span id="img-count">0</span>)</h3>
            <button id="clear-all-btn" class="btn btn-danger" style="display: none;">🗑️ Xóa tất cả</button>
        </div>
        <div id="gallery" class="gallery"></div>

        <div id="crop-area"><img id="image-to-crop" src=""></div>

        <div id="action-panel" class="action-panel">
            <button id="sync-frame-btn" class="btn btn-sync">🎯 Lấy khung cắt này áp dụng cho TẤT CẢ ảnh</button>
            <div class="btn-group">
                <button id="process-single-btn" class="btn btn-single">✂️ Bóc chữ ẢNH NÀY</button>
                <button id="batch-process-btn" class="btn btn-batch">⚡ BÓC CHỮ TOÀN BỘ KHAY</button>
            </div>
        </div>

        <div id="status" class="status"></div>
        <textarea id="result" placeholder="Văn bản bóc được sẽ hiển thị ở đây..."></textarea>
        
        <!-- Khu vực Dạy AI -->
        <div class="filter-panel">
            <button id="add-filter-btn" class="btn-filter">🚫 Bôi đen chữ rác ở trên rồi bấm vào đây để dạy AI</button>
            <div style="font-size: 13px; color: #64748b; margin-top: 5px;">* Các cụm từ dưới đây sẽ tự động bị xóa trong những lần bóc chữ sau (nhớ trọn đời):</div>
            <div id="blacklist-container" class="blacklist-container"></div>
        </div>

        <button id="copy-btn" class="btn btn-primary" disabled>📋 Copy Toàn Bộ Văn Bản</button>
        <canvas id="hidden-canvas"></canvas>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const gallery = document.getElementById('gallery');
        const imgCount = document.getElementById('img-count');
        const clearAllBtn = document.getElementById('clear-all-btn');
        const imageToCrop = document.getElementById('image-to-crop');
        const cropArea = document.getElementById('crop-area');
        const actionPanel = document.getElementById('action-panel');
        
        const syncFrameBtn = document.getElementById('sync-frame-btn');
        const processSingleBtn = document.getElementById('process-single-btn');
        const batchProcessBtn = document.getElementById('batch-process-btn');
        
        const statusEl = document.getElementById('status');
        const resultEl = document.getElementById('result');
        const copyBtn = document.getElementById('copy-btn');
        
        const addFilterBtn = document.getElementById('add-filter-btn');
        const blacklistContainer = document.getElementById('blacklist-container');

        let imageList = [];
        let currentIndex = -1;
        let cropper = null;
        
        // ---- TÍNH NĂNG "DẠY AI" (BLACKLIST) ----
        // Lấy danh sách đen từ LocalStorage (để nhớ sang ngày hôm sau)
        let blacklist = JSON.parse(localStorage.getItem('cao_ocr_blacklist')) || [];

        function renderBlacklist() {
            blacklistContainer.innerHTML = '';
            blacklist.forEach((word, index) => {
                const tag = document.createElement('div');
                tag.className = 'bad-word-tag';
                tag.innerHTML = `<span>${escapeHTML(word)}</span> <span class="remove-word" onclick="removeBlacklist(${index})">✖</span>`;
                blacklistContainer.appendChild(tag);
            });
        }

        function removeBlacklist(index) {
            blacklist.splice(index, 1);
            localStorage.setItem('cao_ocr_blacklist', JSON.stringify(blacklist));
            renderBlacklist();
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }

        // Bôi đen chữ rồi đưa vào danh sách đen
        addFilterBtn.addEventListener('click', () => {
            const start = resultEl.selectionStart;
            const end = resultEl.selectionEnd;
            if (start === end) {
                alert("Đức phải bôi đen (highlight) đoạn chữ rác trong khung kết quả trước!");
                return;
            }
            
            const selectedText = resultEl.value.substring(start, end).trim();
            if (selectedText && !blacklist.includes(selectedText)) {
                blacklist.push(selectedText);
                localStorage.setItem('cao_ocr_blacklist', JSON.stringify(blacklist));
                renderBlacklist();
                
                // Tiêu diệt ngay lập tức từ đó trong khung văn bản hiện tại
                scrubTextarea();
            }
        });

        function scrubTextarea() {
            let currentText = resultEl.value;
            blacklist.forEach(word => {
                // Split & join là cách an toàn nhất thay thế Regex để tránh lỗi ký tự đặc biệt
                currentText = currentText.split(word).join(''); 
            });
            // Dọn dẹp các khoảng trắng và dấu xuống dòng thừa mứa do việc xóa chữ gây ra
            currentText = currentText.replace(/[ \t]{2,}/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
            resultEl.value = currentText;
        }

        function applyBlacklistFilter(text) {
            let cleaned = text;
            blacklist.forEach(word => {
                cleaned = cleaned.split(word).join('');
            });
            // Trả về chuỗi đã sạch rác
            return cleaned;
        }

        // Render blacklist lúc mới tải trang
        renderBlacklist();


        // ---- PHẦN CỐT LÕI OCR (Giữ nguyên) ----
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => addFiles(e.target.files));
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); addFiles(e.dataTransfer.files); });
        document.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            const files = [];
            for (let item of items) { if (item.type.indexOf('image') !== -1) files.push(item.getAsFile()); }
            addFiles(files);
        });

        function addFiles(files) {
            if (!files || files.length === 0) return;
            let added = false;
            for (let file of files) {
                if (file.type.startsWith('image/')) {
                    imageList.push({ id: Date.now() + Math.random(), url: URL.createObjectURL(file), cropData: null });
                    added = true;
                }
            }
            if (added) {
                renderGallery();
                if (currentIndex === -1) selectImage(0);
            }
            fileInput.value = '';
        }

        function renderGallery() {
            gallery.innerHTML = '';
            imgCount.textContent = imageList.length;
            clearAllBtn.style.display = imageList.length > 0 ? 'block' : 'none';
            copyBtn.disabled = resultEl.value.trim().length === 0;

            imageList.forEach((img, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = `thumb-wrapper ${index === currentIndex ? 'active' : ''}`;
                const imgEl = document.createElement('img');
                imgEl.src = img.url;
                imgEl.onclick = () => selectImage(index);
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '✖';
                delBtn.onclick = (e) => { e.stopPropagation(); deleteImage(index); };
                wrapper.appendChild(imgEl);
                wrapper.appendChild(delBtn);
                gallery.appendChild(wrapper);
            });
        }

        function selectImage(index) {
            if (index < 0 || index >= imageList.length) {
                currentIndex = -1; cropArea.style.display = 'none'; actionPanel.style.display = 'none';
                if (cropper) { cropper.destroy(); cropper = null; }
                renderGallery(); return;
            }
            if (currentIndex !== -1 && cropper) imageList[currentIndex].cropData = cropper.getData(true);
            currentIndex = index;
            cropArea.style.display = 'block'; actionPanel.style.display = 'block';
            statusEl.textContent = "Sẵn sàng xử lý."; statusEl.style.color = "#0369a1";

            const currentImgObj = imageList[index];
            if (cropper) cropper.destroy(); 
            imageToCrop.src = currentImgObj.url;
            cropper = new Cropper(imageToCrop, { 
                viewMode: 1, autoCropArea: 0.9, background: false,
                ready: function () { if (currentImgObj.cropData) cropper.setData(currentImgObj.cropData); }
            });
            renderGallery(); 
        }

        function deleteImage(index) {
            URL.revokeObjectURL(imageList[index].url);
            imageList.splice(index, 1);
            if (index === currentIndex) selectImage(index < imageList.length ? index : imageList.length - 1);
            else if (index < currentIndex) { currentIndex--; renderGallery(); }
            else renderGallery();
        }

        clearAllBtn.addEventListener('click', () => {
            if(!confirm("Xóa tất cả ảnh?")) return;
            imageList.forEach(img => URL.revokeObjectURL(img.url)); imageList = []; selectImage(-1);
        });

        syncFrameBtn.addEventListener('click', () => {
            if (!cropper) return;
            const currentData = cropper.getData(true);
            imageList.forEach(img => img.cropData = currentData);
            statusEl.style.color = "#0ea5e9"; statusEl.textContent = "🎯 Đã đồng bộ khung cắt cho toàn bộ ảnh!";
        });

        async function processOCR(cropDataObj, imgUrl) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = async () => {
                    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                    if (!cropDataObj) cropDataObj = { x: 0, y: 0, width: img.width, height: img.height };
                    canvas.width = cropDataObj.width; canvas.height = cropDataObj.height;
                    ctx.drawImage(img, cropDataObj.x, cropDataObj.y, cropDataObj.width, cropDataObj.height, 0, 0, cropDataObj.width, cropDataObj.height);

                    let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height); let data = imgData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                        let color = avg < 140 ? 0 : 255; data[i] = data[i+1] = data[i+2] = color; 
                    }
                    ctx.putImageData(imgData, 0, 0);
                    
                    try {
                        const result = await Tesseract.recognize(canvas.toDataURL('image/png'), 'vie+eng', { tessedit_pageseg_mode: 6 });
                        
                        // Lọc rác Regex cơ bản
                        let cleanedText = result.data.text.replace(/[|¡—_~\[\]]/g, '');
                        // TRUYỀN QUA BỘ LỌC DO USER DẠY
                        cleanedText = applyBlacklistFilter(cleanedText);
                        
                        cleanedText = cleanedText.replace(/^\s*[\r\n]/gm, '').trim();
                        resolve(cleanedText);
                    } catch (error) { reject(error); }
                };
                img.src = imgUrl;
            });
        }

        function appendTextToResult(text) {
            if (resultEl.value.trim() !== '') resultEl.value += '\n\n' + text;
            else resultEl.value = text;
            // Ép dọn dẹp lại toàn bộ khung (phòng khi có nhiều rác nối tiếp nhau)
            scrubTextarea(); 
            copyBtn.disabled = false;
        }

        function setWorkingState(isWorking, text = "") {
            syncFrameBtn.disabled = isWorking; processSingleBtn.disabled = isWorking; batchProcessBtn.disabled = isWorking;
            if (isWorking) { statusEl.style.color = "#d97706"; statusEl.textContent = text; }
        }

        processSingleBtn.addEventListener('click', async () => {
            if (!cropper) return;
            setWorkingState(true, "Đang bóc chữ ảnh này...");
            try {
                const currentData = cropper.getData(true);
                imageList[currentIndex].cropData = currentData;
                const text = await processOCR(currentData, imageList[currentIndex].url);
                appendTextToResult(text);
                statusEl.style.color = "green"; statusEl.textContent = "✨ Xong!";
            } catch (error) {
                statusEl.style.color = "red"; statusEl.textContent = "Lỗi xử lý!";
            } finally { setWorkingState(false); }
        });

        batchProcessBtn.addEventListener('click', async () => {
            if (!cropper || imageList.length === 0) return;
            setWorkingState(true, "⚡ Đang xử lý toàn bộ khay...");
            imageList[currentIndex].cropData = cropper.getData(true);
            let successCount = 0;

            for (let i = 0; i < imageList.length; i++) {
                statusEl.textContent = `Đang xử lý ảnh ${i + 1} / ${imageList.length}...`;
                try {
                    const text = await processOCR(imageList[i].cropData, imageList[i].url);
                    if (text) { appendTextToResult(text); successCount++; }
                } catch (error) { console.error("Lỗi ảnh " + (i+1), error); }
            }
            statusEl.style.color = "green";
            statusEl.textContent = `✨ Hoàn tất! Đã bóc thành công ${successCount}/${imageList.length} ảnh.`;
            setWorkingState(false);
        });

        resultEl.addEventListener('input', () => { copyBtn.disabled = resultEl.value.trim().length === 0; });
        copyBtn.addEventListener('click', () => {
            resultEl.select(); document.execCommand('copy');
            copyBtn.textContent = "✔️ Đã copy!"; setTimeout(() => copyBtn.textContent = "📋 Copy Toàn Bộ Văn Bản", 2000);
        });
    </script>
</body>
</html>
